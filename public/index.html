<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Simuler mes économies – MagicPallet</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="shell">
  <aside class="side" id="side">
    <div class="brand"><span class="bw"><img src="/logo.png" alt="MagicPallet"></span></div>
    <nav class="nav" id="nav" aria-label="Navigation"></nav>
    <div class="side-foot"><button class="btn side" id="b-side-contact"></button></div>
  </aside>
  <div class="main">
    <header class="top">
      <button class="hb" id="hb" aria-label="Ouvrir le menu"></button>
      <span class="pill"><i class="dot"></i><span id="who">Espace découverte</span></span>
      <button class="tb" id="tb-info" aria-label="Aide et contact"></button>
      <span class="lang" aria-hidden="true">fr</span>
    </header>
    <main id="view"></main>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-live="polite"></aside>
<div class="modal" id="modal" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"></div>
<script src="/app.js" defer></script>
</body>
</html>
